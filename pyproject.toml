[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-network-lab"
version = "0.1.0"
description = "Code-driven computer networking tutorial labs in Python."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Network Lab" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netlab = "netlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
